[package]
name = "mst5-client-wasm"
version = "0.7.30"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Browser M5oHS transport for mst5-client"

[lib]
crate-type = ["cdylib"]

[dependencies]
mst5-e2e-core = { path = "../e2e-core" }
base64 = "0.22.1"
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
getrandom = { version = "0.3.3", features = ["wasm_js"] }
# x25519-dalek currently depends on getrandom 0.2; enabling its web backend
# here unifies features for wasm32-unknown-unknown.
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
hkdf = { version = "0.12.4", default-features = false }
js-sys = "0.3.77"
serde = { version = "1.0.219", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0.140"
serde-wasm-bindgen = "0.6.5"
sha2 = { version = "0.10.9", default-features = false }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
x25519-dalek = { version = "2.0.1", default-features = false, features = ["getrandom", "reusable_secrets", "static_secrets", "zeroize"] }
zeroize = { version = "1.8.1", default-features = false, features = ["alloc"] }

[dependencies.web-sys]
version = "0.3.77"
features = ["Headers", "Request", "RequestInit", "RequestMode", "Response", "Window"]
