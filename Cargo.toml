[package]
name = "mst5-client"
version = "0.7.23"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Complete asynchronous client for the MST5.1 protocol"

[features]
default = ["m5oh-tls"]
m5oh-tls = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]

[dependencies]
mst5-e2e-core = { path = "e2e-core" }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
getrandom = "0.3.3"
hkdf = { version = "0.12.4", default-features = false }
hmac = { version = "0.12.1", default-features = false }
miniz_oxide = "0.9.1"
zstd = { version = "0.13.3", default-features = false }
bytes = "1.10.1"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "webp"] }
webp = "0.3.0"
kamadak-exif = "0.6.1"
sha2 = { version = "0.10.9", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.47", default-features = false, features = ["net", "io-util", "time", "rt", "sync", "macros"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"], optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, optional = true }
webpki-roots = { version = "0.26.11", optional = true }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["getrandom", "reusable_secrets", "static_secrets", "zeroize"] }
zeroize = { version = "1.8.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
